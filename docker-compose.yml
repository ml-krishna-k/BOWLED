# Bowled — local docker-compose stack.
#
# Usage:
#   1. Copy .env.example to .env and fill in real values.
#   2. docker compose up --build
#   3. Web → http://localhost:8080   API → http://localhost:4000
#
# MongoDB is NOT included — point mongo_db_uri at your Atlas cluster.
# If you want a fully-local stack later, add a `mongo:` service here.

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: bowled-api:local
    container_name: bowled-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # The web service is published on :8080 — must match for the browser to
      # be allowed to call the API. Add prod URLs here when you deploy.
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake the API URL into the bundle. For prod, set this to your deployed
        # API origin (e.g. https://api.bowled.example.com).
        VITE_API_URL: ""
    image: bowled-web:local
    container_name: bowled-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
